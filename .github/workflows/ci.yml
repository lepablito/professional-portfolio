name: CI

# PR gate: the same checks deploy.yml runs, minus the deploy — so a broken
# branch is blocked before it merges to main instead of failing post-merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check internal links carry the base path
        run: npm run check-links

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke & accessibility tests (Playwright + axe)
        run: npm run test:e2e
