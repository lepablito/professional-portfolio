name: CI

# PR gate: the same checks deploy.yml runs, minus the deploy — so a broken
# branch is blocked before it merges to main instead of failing post-merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check internal links carry the base path
        run: npm run check-links

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke & accessibility tests (Playwright + axe)
        run: npm run test:e2e
